<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

    <header>
        <div class="logo">
            <a href="index.html">DevCraft Hub</a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="catalog.html" class="active">Catalog</a></li>

    <main class="catalog-main">
        <h1>Resource Catalog</h1>
        <p class="catalog-intro">Explore our curated collection of web development modules. Filter by category or view all available tools.</p>

        <div class="filter-buttons">

            <button id="beginner" class="filter-btn">Beginner</button>
            <button id="advanced" class="filter-btn">Advanced</button>

        <div id="catalog-container" class="catalog-grid">
            <!-- JavaScript will populate items here -->
        </div>
    </main>
