<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us - DevCraft Hub</title>
    <meta name="description" content="Submit your feedback or join the DevCraft Hub community network.">
    <meta name="author" content="Your Name">
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">DevCraft Hub</a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="form.html" class="active">Join Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-main">
        <div class="form-container">
            <h1>Community Feedback & Registration</h1>
            <p>Tell us what topics you would like covered or sign up for project updates.</p>
            
            <form id="community-form" action="form.html" method="GET">
                <label for="fullname">Full Name <span class="required">*</span></label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" required>

                <label for="topic">Primary Area of Interest</label>
                <select id="topic" name="topic">
                    <option value="" disabled selected>Select a focus area...</option>
                    <option value="html">HTML5 & Semantic Markup</option>
                    <option value="css">CSS Grid & Responsive Design</option>
                    <option value="js">JavaScript Arrays & DOM</option>
                </select>

                <fieldset class="checkbox-fieldset">
                    <legend>Preferred Content Format</legend>
                    <input type="checkbox" id="format-articles" name="format" value="articles">
                    <label for="format-articles">Written Articles</label>

                    <input type="checkbox" id="format-videos" name="format" value="videos">
                    <label for="format-videos">Video Tutorials</label>
                </fieldset>

                <label for="comments">Additional Comments</label>
                <textarea id="comments" name="comments" rows="4"></textarea>

                <button type="submit" class="submit-btn">Submit Form</button>
            </form>

            <div class="counter-display">
                <p>Total Community Submissions: <span id="submissionCounter">0</span></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DevCraft Hub | WDD 131 Final Project | <a href="references.html">References</a></p>
    </footer>
</body>
</html>
