<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn about Nigeria, its location, culture, and weather.">
    <meta name="author" content="Agbo Chidiebere">
    <title>Nigeria | Country Page</title>

    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <h1>Nigeria</h1>
    </header>

    <main>
        <section class="hero">
            <picture>
                <source media="(min-width: 768px)" srcset="images/nigeria-large.webp">
                <img src="images/nigeria-small.webp" alt="A beautiful view of Nigeria" width="800" height="600">
            </picture>
        </section>

        <section class="content">
            <div class="about">
                <h2>About Nigeria</h2>
                <p>
                    Nigeria is a country in West Africa known for its diverse
                    cultures, languages, landscapes, and vibrant communities.
                </p>
            </div>

            <div class="weather">
                <h2>Weather</h2>
                <img class="weather-icon-mobile" src="images/weather.svg" alt="Partly cloudy weather">
                <p>Temperature: 25 °C</p>
                <p>Wind Speed: 10 km/h</p>
                <p>Wind Chill: <span id="windChill">N/A</span></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Agbo
Chidiebere | Nigeria</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
