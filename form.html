<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review - DevCraft Academy</title>
    <meta name="description" content="Submit a product review for DevCraft Academy learning materials and tools.">
    <meta name="author" content="Your Name">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="wf1">
            <p class="required-note"><span class="required">*</span> Required Fields</p>

            <!-- Product Name -->
            <label for="productName">Product Name <span class="required">*</span></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Overall Rating -->
            <fieldset class="rating-fieldset">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating">
                    <input type="radio" id="star5" name="rating" value="5" required><label for="star5" title="5 stars">☆</label>
                    <input type="radio" id="star4" name="rating" value="4" required><label for="star4" title="4 stars">☆</label>
                    <input type="radio" id="star3" name="rating" value="3" required><label for="star3" title="3 stars">☆</label>
                    <input type="radio" id="star2" name="rating" value="2" required><label for="star2" title="2 stars">☆</label>
                    <input type="radio" id="star1" name="rating" value="1" required><label for="star1" title="1 star">☆</label>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <label for="installDate">Date of Installation <span class="required">*</span></label>
            <input type="date" id="installDate" name="installDate" required>

           <!-- Useful Features -->
<fieldset class="checkbox-fieldset">
    <legend>Which features did you find useful? (Check all that apply)</legend>
    
    <input type="checkbox" id="feature-durability" name="features" value="durability">
    <label for="feature-durability">Durability</label>

    <input type="checkbox" id="feature-ease" name="features" value="ease_of_use">
    <label for="feature-ease">Ease of Use</label>

    <input type="checkbox" id="feature-performance" name="features" value="performance">
    <label for="feature-performance">Performance</label>

    <input type="checkbox" id="feature-design" name="features" value="design">
    <label for="feature-design">Design</label>
</fieldset>

            <!-- Written Review -->
            <label for="writtenReview">Written Review (Optional)</label>
            <textarea id="writtenReview" name="writtenReview" rows="4" placeholder="Share your experience with this product..."></textarea>

            <!-- User Name -->
            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName" placeholder="e.g. Jane Doe">

            <!-- Submit Button -->
            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 DevCraft Academy | WDD 131 | All rights reserved.</p>
    </footer>
</body>
</html>
